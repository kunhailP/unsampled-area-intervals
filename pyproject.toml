[project]
name = "uai"
version = "0.1.0"
description = "Prediction intervals for unsampled-area means from noisy survey estimates"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "rdata>=0.11",
]

[project.optional-dependencies]
test = ["pytest>=7"]
figures = ["matplotlib>=3.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
